<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#7C3AED"/>
  <!-- Clock face -->
  <circle cx="16" cy="16" r="11" fill="white" fill-opacity="0.15" stroke="white" stroke-width="1.5"/>
  <!-- Hour hand (pointing to ~10) -->
  <line x1="16" y1="16" x2="11.5" y2="10.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~12) -->
  <line x1="16" y1="16" x2="16" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="white"/>
</svg>
