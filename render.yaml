services:
  - type: web
    name: attendance-tracker
    runtime: node
    plan: free
    buildCommand: >
      cd frontend && npm install --include=dev && npm run build &&
      cd ../backend && npm install --production
    startCommand: node backend/server.js
    envVars:
      # Set in Render Dashboard (no trailing slash). Required for password-reset
      # and QR links — e.g. https://attend-39qi.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: QR_ROTATION_MINUTES
        value: "5"
      - key: TOKEN_EXPIRY_MINUTES
        value: "60"
